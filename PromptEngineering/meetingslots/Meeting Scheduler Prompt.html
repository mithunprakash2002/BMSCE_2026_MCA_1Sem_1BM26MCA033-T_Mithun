<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meeting Scheduler Prompt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef2f6;--surface:#fff;--ink:#14213d;--muted:#5b6678;--line:#cfd8e3;
  --accent:#0f766e;--accent-ink:#fff;--ok:#0f766e;--bad:#b42318;--okbg:#e3f4f1;--badbg:#fdeceb;--code:#0e1a2f;--codeink:#d9e6f7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1422;--surface:#142034;--ink:#e6edf7;--muted:#98a6bb;--line:#26364f;
  --accent:#2dd4bf;--accent-ink:#06201d;--ok:#5eead4;--bad:#fca5a5;--okbg:#0f2e2c;--badbg:#3a1a1a;--code:#08101d;--codeink:#cfe0f5;}}
:root[data-theme="dark"]{
  --bg:#0c1422;--surface:#142034;--ink:#e6edf7;--muted:#98a6bb;--line:#26364f;
  --accent:#2dd4bf;--accent-ink:#06201d;--ok:#5eead4;--bad:#fca5a5;--okbg:#0f2e2c;--badbg:#3a1a1a;--code:#08101d;--codeink:#cfe0f5;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:60ch;margin:0 0 28px}
.grid{display:block;max-width:640px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{font-size:1.1rem;margin:0 0 14px;font-weight:600}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
.hint{color:var(--muted);font-weight:400;font-size:.82rem}
textarea,input{width:100%;font:400 .9rem/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:12px}.row>div{flex:1}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:600 .95rem "Bricolage Grotesque",system-ui,sans-serif;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.out{margin-top:20px;border-radius:8px;padding:16px;font:600 1.4rem "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.out.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.out.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.outlabel{font-size:.82rem;color:var(--muted);margin:18px 0 -14px}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
.trace{list-style:none;margin:10px 0 0;padding:0;font-size:.88rem}
.trace li{padding:8px 0;border-bottom:1px dashed var(--line)}
.trace b.p{color:var(--ok)}.trace b.f{color:var(--bad)}
.trace span{display:block;color:var(--muted);font-size:.82rem}
pre{margin:0;background:var(--code);color:var(--codeink);border-radius:8px;padding:16px;font:400 .8rem/1.6 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto}
.err{color:var(--bad);font-size:.85rem;margin-top:8px}
.copied{color:var(--ok);font-size:.85rem;align-self:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Meeting scheduler prompt</h1>
  <p class="lede">Enter the slots and rules. The page checks each slot and returns the first one that meets every rule.</p>

  <div class="grid">
    <section class="panel" aria-labelledby="in-h">
      <h2 id="in-h">Scheduling inputs</h2>

      <label for="slots">Available slots <span class="hint">one per line</span></label>
      <textarea id="slots" spellcheck="false"></textarea>

      <div class="row">
        <div><label for="dur">Meeting duration <span class="hint">minutes</span></label><input id="dur" type="number" min="1" step="1"></div>
        <div><label for="cut">Must end by <span class="hint">time</span></label><input id="cut" type="text" spellcheck="false"></div>
      </div>

      <label for="unav">Unavailable times <span class="hint">one per line, e.g. Manager: 10:00 AM – 12:00 PM</span></label>
      <textarea id="unav" spellcheck="false"></textarea>

      <div class="btns">
        <button class="primary" id="run" type="button">Find slot</button>
        <button id="reset" type="button">Reset to sample</button>
      </div>
      <div class="err" id="err" role="alert"></div>

      <div class="outlabel">Result</div>
      <div class="out" id="out" aria-live="polite">–</div>

      <details>
        <summary>Why each slot passed or failed</summary>
        <ul class="trace" id="trace"></ul>
      </details>
    </section>

  </div>
</div>

<script>
var SAMPLE={
  slots:"10:00 AM – 11:00 AM\n11:00 AM – 12:00 PM\n2:00 PM – 3:00 PM",
  dur:60,
  cut:"4:00 PM",
  unav:"Manager: 10:00 AM – 12:00 PM"
};
var $=function(id){return document.getElementById(id)};

function toMin(s){
  var m=/^\s*(\d{1,2})(?::(\d{2}))?\s*([AaPp])\.?[Mm]\.?\s*$/.exec(s);
  if(!m)return null;
  var h=+m[1],mi=m[2]?+m[2]:0;
  if(h<1||h>12||mi>59)return null;
  h=h%12;if(/p/i.test(m[3]))h+=12;
  return h*60+mi;
}
function parseRange(line){
  var parts=line.split(/\s*(?:–|—|-|\bto\b)\s*/i);
  var t=line.match(/\d{1,2}(?::\d{2})?\s*[AaPp]\.?[Mm]\.?/g);
  if(!t||t.length!==2)return null;
  var a=toMin(t[0]),b=toMin(t[1]);
  if(a===null||b===null||b<=a)return null;
  return {start:a,end:b};
}
function lines(v){return v.split("\n").map(function(s){return s.trim()}).filter(Boolean)}
function fmt(m){var h=Math.floor(m/60),mi=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+(mi<10?"0":"")+mi+" "+ap}

function evaluate(){
  var errs=[],trace=[];
  var dur=parseInt($("dur").value,10);
  if(!(dur>0))errs.push("Enter a meeting duration in minutes.");
  var cutTxt=$("cut").value.trim(),cut=null;
  if(cutTxt){cut=toMin(cutTxt);if(cut===null)errs.push("Could not read the end-by time. Use a format like 4:00 PM.")}
  var blocks=[];
  lines($("unav").value).forEach(function(l){
    var body=l.indexOf(":")>-1&&!/^\d/.test(l)?l.slice(l.indexOf(":")+1):l;
    var r=parseRange(body);
    if(!r)errs.push("Could not read unavailable time: \""+l+"\".");
    else blocks.push({label:l,r:r});
  });
  var slots=lines($("slots").value);
  if(!slots.length)errs.push("Add at least one available slot.");
  var chosen=null;
  slots.forEach(function(s){
    var r=parseRange(s),reasons=[];
    if(!r){trace.push({s:s,pass:false,why:["Not a readable time range, so it is skipped."]});return}
    if(dur>0&&r.end-r.start!==dur)reasons.push("Length is "+(r.end-r.start)+" min, not "+dur+" min.");
    blocks.forEach(function(b){
      if(r.start<b.r.end&&b.r.start<r.end)reasons.push("Overlaps unavailable time ("+b.label+").");
    });
    if(cut!==null&&r.end>cut)reasons.push("Ends after "+fmt(cut)+".");
    var pass=reasons.length===0;
    trace.push({s:s,pass:pass,why:pass?["Meets every rule."]:reasons});
    if(pass&&!chosen)chosen=s;
  });
  return {errs:errs,trace:trace,chosen:chosen};
}

function run(){
  var r=evaluate(),out=$("out");
  $("err").textContent=r.errs.join(" ");
  var t=$("trace");t.innerHTML="";
  r.trace.forEach(function(x){
    var li=document.createElement("li");
    var b=document.createElement("b");b.className=x.pass?"p":"f";b.textContent=(x.pass?"Pass: ":"Fail: ")+x.s;
    var sp=document.createElement("span");sp.textContent=x.why.join(" ");
    li.appendChild(b);li.appendChild(sp);t.appendChild(li);
  });
  if(r.errs.length){out.className="out bad";out.textContent="NO_AVAILABLE_SLOT";return}
  if(r.chosen){out.className="out ok";out.textContent=r.chosen}
  else{out.className="out bad";out.textContent="NO_AVAILABLE_SLOT"}
}

function load(o){
  $("slots").value=o.slots;$("dur").value=o.dur;$("cut").value=o.cut;$("unav").value=o.unav;
  run();
}

["slots","dur","cut","unav"].forEach(function(id){
  $(id).addEventListener("input",run);
});
$("run").addEventListener("click",run);
$("reset").addEventListener("click",function(){load(SAMPLE)});
load(SAMPLE);
</script>
</body>
</html>
